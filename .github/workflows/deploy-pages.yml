# Publishes the Website/ folder to GitHub Pages. Runs only when started by hand
# (Actions -> "Deploy the website to GitHub Pages" -> Run workflow). See docs/DEPLOY.md.
name: Deploy the website to GitHub Pages
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website
      - id: deployment
        uses: actions/deploy-pages@v4
